<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="460px" preserveAspectRatio="none" style="width:630px;height:460px;background:#FFFFFF;" version="1.1" viewBox="0 0 630 460" width="630px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="272" x="178" y="29.0752">4-Connect&#160;-&#160;Spielhilfe&#160;(Wireframe)</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="73" x="8" y="59.7363">Hilfe / Regeln</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274" x="8" y="95.9238">Kurzbeschreibung der Bedienung und Spielregeln</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="362" x="8" y="130.1113">&#8222;4-Connect&#8220; ist eine digitale Umsetzung des Spiels &#8222;Vier Gewinnt&#8220;.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="581" x="8" y="147.2051">Ziel des Spiels ist es, als erster Spieler vier eigene Spielsteine in einer durchgehenden Linie zu platzieren.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="314" x="8" y="164.2988">Die Linie kann horizontal, vertikal oder diagonal verlaufen.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="584" x="8" y="198.4863">Gespielt wird auf einem vertikal aufgebauten Spielfeld mit mehreren Spalten. Zwei Spieler (oder ein Spieler</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="613" x="8" y="215.5801">gegen den Computer) setzen abwechselnd jeweils einen Spielstein. Durch Antippen oder Anklicken einer Spalte</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="551" x="8" y="232.6738">wird bestimmt, wo der Stein fallen soll. Der Spielstein rutscht anschlie&#223;end automatisch in die tiefste</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194" x="8" y="249.7676">freie Position der gew&#228;hlten Spalte.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="543" x="8" y="283.9551">Das Spiel endet, sobald ein Spieler vier Steine in einer Reihe erreicht oder das Spielfeld vollst&#228;ndig</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="433" x="8" y="301.0488">gef&#252;llt ist, ohne dass eine Gewinnkombination entstanden ist (Unentschieden).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="554" x="8" y="335.2363">Die Bedienung erfolgt vollst&#228;ndig &#252;ber eine einfache grafische Oberfl&#228;che. Alle Aktionen wie Spielzug,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="560" x="8" y="352.3301">Neustart oder R&#252;ckkehr ins Men&#252; werden &#252;ber deutlich gekennzeichnete Schaltfl&#228;chen ausgef&#252;hrt und</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217" x="8" y="369.4238">ben&#246;tigen keine zus&#228;tzlichen Eingaben.</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="68" x="10.5" y="412.748"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="37" x="26" y="427.2051">Zur&#252;ck</text><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="623" y1="45.2793" y2="45.2793"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="623" y1="453.4355" y2="453.4355"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="6" y1="45.2793" y2="64.373"/><line style="stroke:#000000;stroke-width:1.0;" x1="623" x2="623" y1="45.2793" y2="64.373"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="6" y1="408.248" y2="436.3418"/><line style="stroke:#000000;stroke-width:1.0;" x1="623" x2="623" y1="408.248" y2="436.3418"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="6" y1="374.0605" y2="391.1543"/><line style="stroke:#000000;stroke-width:1.0;" x1="623" x2="623" y1="374.0605" y2="391.1543"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="6" y1="64.373" y2="81.4668"/><line style="stroke:#000000;stroke-width:1.0;" x1="623" x2="623" y1="64.373" y2="81.4668"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="6" y1="436.3418" y2="453.4355"/><line style="stroke:#000000;stroke-width:1.0;" x1="623" x2="623" y1="436.3418" y2="453.4355"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="6" y1="391.1543" y2="408.248"/><line style="stroke:#000000;stroke-width:1.0;" x1="623" x2="623" y1="391.1543" y2="408.248"/><line style="stroke:#000000;stroke-width:1.0;" x1="6" x2="6" y1="81.4668" y2="374.0605"/><line style="stroke:#000000;stroke-width:1.0;" x1="623" x2="623" y1="81.4668" y2="374.0605"/><!--SRC=[NLJBRjn64BplL_HHKjRhYtz0iHm7y2kGu0HGaCCisIJR7FOiPffQW8O0VqYGNFGDFkd6F_6Nk6QukrPoMIvxs5NLrKMQc6TwyUnbKENAw1dTx8Hz9xvXElj38ZVH3No-MgLUTETmGpKtRlJsIr1xZpDw5pIadQkunbFEs-hpYkZpJ_Z1XIukVYrWp-cQM_PwSK7tgyro-6QCqvPJrKMMxQWje2FzpBMmvhjHwqLEB9s7hczV_Zdf_VRbRv9anA9CjRHY3kDy71BRjE2b1I7bjjy5yAzvBwgvSu6xnUdJvmfSMfF3Vux9q59ESBtB_ImjWsnvsWgnQ14GgHvZrRNSiTQiz5PKcAQHTjxPX5xM3HNEAzINqzwfKXUYJ73J-JNTSJJfdQUGlQZ5jK5nXx9tOmE4WmklEMK5Hdk9DU6eI1X-zAFKyjQD1YL5RCE-fa6C1eRViPInhIpgTizoclAiC0FjL2c4BNQWbETw6OOTOECvPPjHSDizLrt2YchwnC3Ara6DFd5fGrVP7BfKazqEHuNbKdilLSz70nT52s4P3Eam6GPRqpwKTDnaC6gSzsXAmNi07rTKY2YEXaGPESN52y__OXsmmyBWJ53B-qB4o8IRT6Hh446ctq8Iaw25gkNz_D1vEpbrzFxA7T92UT7GbiBMmToddfMitFml7zSi7IDLuCeAbnKVmSf-xZ1Hilb14UQZxytywB5e17DDeSj1Tsan-13cFWnRKLU4ireoL_ANatpsKNEbweHHEZzDW5b_l6SSc-1R-o_v_BX